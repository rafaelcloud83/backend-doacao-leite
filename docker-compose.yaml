services:
  database:
    image: postgres:15-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: doacao
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    image: rafaelcloud83/doa-leite:1.0
    container_name: backend
    restart: always
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://database:5432/doacao
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - database
    networks:
      - app-network

networks:
  app-network:
    driver: bridge